# Visual reference for the `cdub` Charybdis Nano (3x5) keymap.
#
# Generated from keymap.c by hand -- keep in sync when you edit the keymap.
# Render with:  make keymap-svg     (from the userspace root)
#
# Key notation:
#   t: tap    h: hold (mod-tap / layer-tap)    s: shifted
#   type: held  -> the key that activates this layer

layout:
    qmk_keyboard: bastardkb/charybdis/3x5

layers:
    # ---------------------------------------------------------------- layer 0
    Base:
        - [{ t: Q, h: Sft+Sup }, { t: W, h: Sft+Alt }, { t: F, h: Ctl+Sft }, P, B,
           J, L, U, Y, { t: "'", s: '"' }]
        - [A, R, S, T, G,
           M, N, E, I, O]
        - [{ t: Z, h: Super }, { t: X, h: Alt }, { t: C, h: Ctrl }, { t: D, h: Shift }, { t: V, h: Pointer },
           { t: K, h: Pointer }, { t: H, h: Shift }, { t: ',', h: Ctrl, s: '<' }, { t: '.', h: Alt, s: '>' }, { t: '/', h: Super, s: '?' }]
        - [{ t: Esc, h: Pointer }, { t: Tab, h: Symbols }, { t: Enter, h: Function },
           { t: Bspc, h: Media }, { t: Space, h: Numeral }]

    # ---------------------------------------------------------------- layer 1
    Function:
        - ['', '', '', '', '',
           PrtSc, F7, F8, F9, F12]
        - ['', '', '', '', '',
           Caps Lock, F4, F5, F6, F11]
        - [Boot, Reboot, '', '', '',
           Hyper, F1, F2, F3, F10]
        - ['', '', { type: held },
           '', '']

    # ------------------------------------------- layer 2 -- NOT BOUND ANYWHERE
    Navigation (unreachable):
        - ['', '', '', '', '',
           '', '', '', '', '']
        - ['', '', '', '', '',
           Caps Lock, '←', '↓', '↑', '→']
        - [Super, Alt, Ctrl, Shift, '',
           Ins, Home, PgDn, PgUp, End]
        - ['▽', '', '',
           Enter, Bspc]

    # ---------------------------------------------------------------- layer 3
    Media:
        - ['', RGB Prev, RGB Tog, RGB Next, '',
           '', RGB Prev, RGB Tog, RGB Next, '']
        - [Prev, 'Vol −', Mute, 'Vol +', Next,
           Prev, 'Vol −', Mute, 'Vol +', Next]
        - ['', '', '', EE Clear, Boot,
           Boot, EE Clear, Pause, '', Boot]
        - [Stop, Play/Pause, Stop,
           { type: held }, Play/Pause]

    # ---------------------------------------------------------------- layer 4
    Pointer:
        - [Boot, EE Clear, '', 'DPI +', 'Snipe DPI +',
           'Snipe DPI +', 'DPI +', '', EE Clear, Boot]
        - ['▽', '', Drag Scroll, Sniper, '',
           '', Btn 1, Btn 2, Btn 3, '▽']
        - [Super, Alt, Ctrl, Shift, '',
           'Wheel ←', 'Wheel ↓', 'Wheel ↑', 'Wheel →', Super]
        - [{ type: held }, '', '',
           'Wheel ↓', 'Wheel ↑']

    # ---------------------------------------------------------------- layer 5
    Numeral:
        - [Esc, '', '(', ')', '_',
           '-', '7', '8', '9', '0']
        - [Tab, '|', '{', '}', '+',
           '=', '4', '5', '6', Enter]
        - ['`', '~', '[', ']', '\',
           '', '1', '2', '3', '*']
        - [Alt, Function, Shift,
           '', { type: held }]

    # ---------------------------------------------------------------- layer 6
    Symbols:
        - ['!', '@', '#', '$', '%',
           '^', '&', '*', ';', ':']
        - [Esc, Ctrl, { t: Enter, h: Ctl+Sft }, Tab, Shift,
           '←', '↓', '↑', '→', "'"]
        - [Del, Del, Del, Ctrl+Alt Del, Super,
           Home, PgDn, PgUp, End, '"']
        - ['', { type: held }, '▽',
           R Alt, Caps Word]
